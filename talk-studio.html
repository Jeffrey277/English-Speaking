<title>English Talk Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: two-pane studio — topic rail on the left (주제 / 지난 주제 / 오답노트), chat or review sheet on the right */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --sunk:#E3E9E7; --line:#CFD8D5;
  --ink:#16232A; --muted:#5B6B70; --accent:#0F5C5A; --accent-ink:#FFFFFF; --accent-soft:#D6E8E6;
  --amber:#B86A12; --amber-soft:#F6E7D2; --danger:#B3362B; --danger-soft:#F7E1DE; --good:#2E7D4F; --good-soft:#DDF0E4;
  --f-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-script:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1719; --surface:#172225; --sunk:#1E2B2F; --line:#2C3B40;
  --ink:#E4ECEA; --muted:#93A5A9; --accent:#5FB8B2; --accent-ink:#0B1A1A; --accent-soft:#1D3A39;
  --amber:#E1A04D; --amber-soft:#3A2C18; --danger:#E7766B; --danger-soft:#3A1F1C; --good:#6FCB94; --good-soft:#1B3325; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1719; --surface:#172225; --sunk:#1E2B2F; --line:#2C3B40;
  --ink:#E4ECEA; --muted:#93A5A9; --accent:#5FB8B2; --accent-ink:#0B1A1A; --accent-soft:#1D3A39;
  --amber:#E1A04D; --amber-soft:#3A2C18; --danger:#E7766B; --danger-soft:#3A1F1C; --good:#6FCB94; --good-soft:#1B3325; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:500}
.spacer{flex:1}
.pill{font-family:var(--f-mono);font-size:12px;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.pill.ok i{background:var(--accent)} .pill.local i{background:var(--amber)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.warn{color:var(--danger)}
.btn.warn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px;flex:none}
#menuBtn{display:none}

.app{flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;width:100%;margin:0 auto}

/* left rail */
.rail{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:10px;border-bottom:1px solid var(--line);background:var(--sunk)}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 4px;font-size:13px;color:var(--muted);font-weight:600}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 0 0 1px var(--line)}
.seg small{font-family:var(--f-mono);font-weight:400;font-size:11px;margin-left:3px}
.rail-body{flex:1;overflow-y:auto;padding:8px 10px 14px}
.grp{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 6px 4px}
.item{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:8px 10px}
.item:hover{background:var(--sunk)}
.item.on{background:var(--accent-soft)}
.item b{display:block;font-weight:600;font-size:14px}
.item.on b{color:var(--accent)}
.item span{display:block;font-family:var(--f-script);font-size:13px;color:var(--muted);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-family:var(--f-mono);font-style:normal;font-size:11px}
.custom{display:flex;gap:6px;margin:10px 6px 0}
.custom input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px}
.empty-note{color:var(--muted);font-size:13px;padding:16px 8px;line-height:1.6}

/* right sheet */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.sheet-head{flex:none;padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sheet-head .t{flex:1;min-width:180px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-script);font-weight:500;font-size:1.35rem;margin:2px 0 0;text-wrap:balance;line-height:1.3}
.head-actions{display:flex;gap:6px;flex-wrap:wrap}

.log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:min(640px,92%)}
.msg .av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;background:var(--accent);color:var(--accent-ink)}
.msg .bubble{border-radius:14px 14px 14px 4px;padding:10px 14px;background:var(--sunk);white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .av{background:var(--amber-soft);color:var(--amber)}
.msg.me .bubble{background:var(--accent);color:var(--accent-ink);border-radius:14px 14px 4px 14px}
.msg .tools{display:flex;flex-direction:column;gap:2px}
.icon{border:0;background:transparent;color:var(--accent);border-radius:7px;width:28px;height:28px;display:grid;place-items:center}
.icon:hover{background:var(--accent-soft)}
.icon svg{width:17px;height:17px}
.icon.on{background:var(--accent);color:var(--accent-ink)}
.hint{align-self:flex-start;margin-left:40px;max-width:min(600px,88%);background:var(--amber-soft);border-radius:10px;padding:10px 14px;font-size:14px}
.hint b{color:var(--amber);font-size:12px;font-family:var(--f-mono);letter-spacing:.06em}
.hint ul{margin:6px 0 0;padding-left:18px}
.hint li{margin:2px 0}
.hint .en{font-family:var(--f-script)}
.hint .ko{color:var(--muted);font-size:13px}
.err{align-self:center;color:var(--danger);background:var(--danger-soft);border-radius:8px;padding:8px 12px;font-size:13px;max-width:90%}
.typing{color:var(--muted);font-style:italic}

.composer{flex:none;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:flex-end;background:var(--surface)}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 12px;font:15px/1.5 var(--f-ui);max-height:140px}
.composer textarea:focus{border-color:var(--accent);outline:none}
.mic.on{background:var(--danger);color:#fff;border-color:var(--danger)}
.subbar{flex:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px 0;font-size:12.5px;color:var(--muted)}
.subbar label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}

/* review */
.doc{flex:1;overflow-y:auto;padding:18px 20px 32px;display:flex;flex-direction:column;gap:18px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h2{font-size:12px;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:500}
.summary{font-size:15px;margin:0}
.level{display:inline-block;font-family:var(--f-mono);font-size:12px;background:var(--accent-soft);color:var(--accent);padding:2px 10px;border-radius:99px;margin-bottom:8px}
.fix{padding:10px 0;border-top:1px dashed var(--line);display:grid;gap:4px}
.fix:first-of-type{border-top:0;padding-top:0}
.said{color:var(--danger);text-decoration:line-through;text-decoration-thickness:1px}
.said,.better{font-family:var(--f-script);font-size:15.5px}
.better{color:var(--good);font-weight:500}
.arrow{color:var(--muted);font-family:var(--f-mono);margin-right:4px}
.why{color:var(--muted);font-size:13.5px}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;border-radius:99px;padding:0 8px;margin-left:6px;background:var(--sunk);color:var(--muted);vertical-align:middle;text-decoration:none;font-weight:400}
.date{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.list{margin:0;padding-left:18px}
.list li{margin:3px 0}
.expr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 14px}
.expr .en{font-family:var(--f-script)}
.expr .ko{color:var(--muted);font-size:14px}
.bars{display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:90px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13.5px}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar-row .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.transcript .line{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:4px 0;font-size:14px}
.transcript .who{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:3px}
.transcript .me{color:var(--ink)} .transcript .ai{color:var(--muted)}
body.quiz .better-wrap{filter:blur(6px);cursor:pointer;user-select:none}
body.quiz .better-wrap.reveal{filter:none}
body.quiz .why{display:none}
body.quiz .fix.revealed .why{display:block}
.analysis{white-space:pre-wrap;font-size:14.5px}
.center{flex:1;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.center h2{font-family:var(--f-script);font-weight:500;color:var(--ink);font-size:1.3rem;margin:0 0 6px}

/* voice call panel */
.call{flex:none;border-top:1px solid var(--line);padding:16px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface)}
.orb{width:84px;height:84px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--sunk);color:var(--muted);transition:background .2s}
.orb svg{width:34px;height:34px}
.call[data-phase="listening"] .orb{background:var(--danger);color:#fff;animation:pulse 1.6s infinite}
.call[data-phase="speaking"] .orb{background:var(--accent);color:var(--accent-ink)}
.call[data-phase="thinking"] .orb{background:var(--amber-soft);color:var(--amber)}
.call[data-mic="off"] .orb{background:var(--sunk);color:var(--danger);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--danger) 45%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
.call .status{font-weight:600;font-size:14px;text-align:center}
.call .live{min-height:1.6em;font-family:var(--f-script);font-size:17px;text-align:center;max-width:620px;overflow-wrap:anywhere}
.call .live:empty::before{content:attr(data-ph);color:var(--muted);font-family:var(--f-ui);font-size:13px}
.call .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.call select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:5px 6px;font:inherit;font-size:13px}
.call .note{font-size:12px;color:var(--muted);text-align:center}
.btn.voice.on{background:var(--danger);border-color:var(--danger);color:#fff}

@media (max-width:860px){
  #menuBtn{display:inline-flex}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  body.rail-open .rail{display:flex}
  body.rail-open .sheet{display:none}
  .brand .name{display:none}
}
@media (max-width:480px){.btn .lbl{display:none}.expr{grid-template-columns:minmax(0,1fr)}.expr .ko{margin-bottom:6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <button class="btn" id="menuBtn" aria-label="주제 목록 열기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="lbl">주제</span></button>
  <div class="brand"><span class="mark">EN</span><span class="name">English Talk Studio</span></div>
  <span class="spacer"></span>
  <span class="pill" id="savePill"><i></i><span>불러오는 중</span></span>
</header>

<div class="app">
  <aside class="rail" id="rail">
    <div class="seg" role="tablist">
      <button role="tab" data-tab="topics" aria-selected="true">대화 주제</button>
      <button role="tab" data-tab="past" aria-selected="false">지난 주제<small id="pastCount"></small></button>
      <button role="tab" data-tab="notes" aria-selected="false">오답노트<small id="noteCount"></small></button>
    </div>
    <div class="rail-body" id="railBody"></div>
  </aside>
  <main class="sheet" id="sheet"></main>
</div>

<script>
(function(){
"use strict";

/* ---------- topics ---------- */
const TOPICS = [
  {g:"워밍업", id:"daily", ko:"오늘 하루", en:"How's your day going?", open:"Hi! It's great to see you. So, how's your day going so far? Did anything interesting happen today?"},
  {g:"워밍업", id:"weekend", ko:"주말 이야기", en:"What did you do last weekend?", open:"Hey there! Let's chat about the weekend. What did you do last weekend? Anything fun?"},
  {g:"워밍업", id:"free", ko:"자유 대화", en:"Talk about anything", open:"Hi! Today we can talk about anything you like. What's on your mind these days?"},
  {g:"OPIc 단골 주제", id:"intro", ko:"자기소개", en:"Tell me about yourself.", open:"Nice to meet you! Let's start simple. Could you tell me a little about yourself?"},
  {g:"OPIc 단골 주제", id:"work", ko:"직장과 업무", en:"What do you do at work?", open:"I'd love to hear about your job. What do you do, and what does a typical workday look like for you?"},
  {g:"OPIc 단골 주제", id:"home", ko:"집과 동네", en:"Describe your home and neighborhood.", open:"Let's talk about where you live. Can you describe your home? What's your favorite room?"},
  {g:"OPIc 단골 주제", id:"family", ko:"가족", en:"Tell me about your family.", open:"Tell me about your family! Who do you live with, and what do you like to do together?"},
  {g:"OPIc 단골 주제", id:"movie", ko:"영화·공연", en:"What kind of movies do you like?", open:"Do you like movies? What kind of movies do you usually watch, and what's one you really enjoyed?"},
  {g:"OPIc 단골 주제", id:"park", ko:"공원·산책", en:"Do you go to parks?", open:"Do you ever go to parks? Tell me about a park you like to visit and what you do there."},
  {g:"OPIc 단골 주제", id:"camping", ko:"캠핑·여행", en:"Tell me about a trip you remember.", open:"Let's talk about travel. Have you been on a trip or a camping trip recently? Where did you go?"},
  {g:"OPIc 단골 주제", id:"weather", ko:"날씨·계절", en:"What's the weather like where you live?", open:"What's the weather like where you live these days? Which season do you like the most?"},
  {g:"OPIc 단골 주제", id:"tech", ko:"기술·인터넷", en:"How do you use technology?", open:"Technology changes so fast! What apps or gadgets do you use most in your daily life?"},
  {g:"생각 말하기", id:"change", ko:"과거와 현재 비교", en:"How has something changed?", open:"Let's compare the past and the present. Can you think of something in your life that has changed a lot over the years?"},
  {g:"생각 말하기", id:"issue", ko:"사회 이슈", en:"What's a concern in your community?", open:"Here's a bigger question. What's one issue or concern people in your country talk about these days?"},
  {g:"롤플레이", id:"rp-ask", ko:"롤플레이: 질문하기", en:"Call a store and ask questions.", open:"Let's do a role-play! I work at a camping gear shop, and you're calling to ask about renting a tent. Ring ring... Hello, Green Trail Outdoor, how can I help you?"},
  {g:"롤플레이", id:"rp-problem", ko:"롤플레이: 문제 해결", en:"Solve a problem politely.", open:"Role-play time! You booked a hotel room, but when you arrive, I tell you there's a problem with your reservation. Ready? ... Good evening! Hmm, I'm sorry, but I can't find your reservation in our system."},
];
const CATS = {grammar:"문법", tense:"시제", article:"관사", preposition:"전치사", vocabulary:"어휘", naturalness:"자연스러움", word_order:"어순", pronunciation:"표현 습관"};

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = ts => { const d = new Date(ts); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`; };
const ICON = {
  speak:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>',
  hint:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>',
};

/* ---------- state ---------- */
const S = {
  tab: "topics",
  view: "welcome",        // welcome | chat | review | notes
  chat: null,             // {topic, messages:[{role,content}], hints:{idx:hint}, startedAt}
  sessions: [],
  openId: null,
  busy: false,
  quiz: false,
  analysis: "",
  autoSpeak: false,
};
let sample = null, db = null, col = null, tts = null, dict = null;

/* ---------- storage ---------- */
const LS = "ets_sessions_v1";
function lsLoad(){ try { return JSON.parse(localStorage.getItem(LS) || "[]"); } catch(e){ return []; } }
function lsSave(){ try { localStorage.setItem(LS, JSON.stringify(S.sessions)); } catch(e){} }
function setPill(kind, text){ const p = $("#savePill"); p.className = "pill " + kind; p.lastElementChild.textContent = text; }

async function saveSession(sess){
  if (col){
    const { id, ...data } = sess;
    await col.doc(id).set(data);
  } else {
    S.sessions = [sess, ...S.sessions.filter(s => s.id !== sess.id)];
    lsSave(); renderRail();
  }
}
async function deleteSession(id){
  if (col) await col.doc(id).delete();
  else { S.sessions = S.sessions.filter(s => s.id !== id); lsSave(); renderRail(); }
}

/* ---------- prompts ---------- */
function partnerRules(topic){
  return `You are Sam, a warm, curious English conversation partner on a video-call style speaking practice app. The learner is a Korean adult at an intermediate level preparing for spoken English tests like OPIc.
Topic: "${topic.en}" (${topic.ko}).
Rules:
- Speak like a friendly native speaker in casual spoken English. Reply in 1-3 short sentences, then ask ONE natural follow-up question that keeps the learner talking about the topic.
- React to what the learner actually said with real interest (short reactions like "Oh, nice!" or "That sounds tough.").
- Do NOT correct mistakes or explain grammar during the chat. If you want, quietly reuse the correct form in your reply.
- If the learner writes in Korean, seems stuck, or asks for help, answer briefly in simple English and offer one example sentence they could say.
- If this is a role-play, stay in character.
- Plain text only: no markdown, no lists, no emoji.`;
}
function chatInput(chat){
  const msgs = [{role:"user", content: partnerRules(chat.topic) + "\n\nStart the conversation now."}];
  chat.messages.forEach(m => msgs.push({role: m.role, content: m.content}));
  return msgs;
}
function transcriptText(chat){
  return chat.messages.map(m => (m.role === "user" ? "LEARNER: " : "SAM: ") + m.content).join("\n");
}

/* ---------- capability boot ---------- */
async function boot(){
  if (!window.claude || !window.claude.use){ startLocal(); return; }
  const [smp, dbx, usr, t, d] = await Promise.all(["sample","db","user","tts","dictation"].map(n => window.claude.use(n).catch(() => null)));
  sample = smp; tts = t; dict = d;
  if (dict){
    dict.onPartial(({text}) => {
      if (V.on) return voicePartial(text);
      const ta = $("#input"); if (ta) { ta.value = (ta.dataset.base || "") + text; autosize(ta); }
    });
    dict.onFinal(({text}) => {
      if (V.on) return voiceFinal(text);
      const ta = $("#input"); if (ta) { const b = ta.dataset.base || ""; ta.dataset.base = b ? b + text : text.trimStart(); ta.value = ta.dataset.base; autosize(ta); }
    });
    dict.onState(({state}) => {
      const b = $("#micBtn"); if (b) b.classList.toggle("on", state === "listening" || state === "starting");
      if (V.on){ V.micOff = state === "idle"; drawCall(); }
    });
  }
  const uid = usr ? await usr.id() : null;
  if (dbx && uid){
    db = dbx; col = db.collection("data/users/" + uid);
    const timer = setTimeout(() => { if (!S.loaded){ startLocal(); } }, 10000);
    col.onSnapshot(snap => {
      clearTimeout(timer); S.loaded = true;
      S.sessions = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.endedAt||0) - (a.endedAt||0));
      setPill("ok", "계정에 저장됨");
      renderRail(); if (S.view === "notes" || (S.view === "review" && S.openId)) renderSheet();
    }, () => { clearTimeout(timer); startLocal(); });
  } else startLocal();
  renderSheet();
}
function startLocal(){
  col = null; S.loaded = true;
  S.sessions = lsLoad();
  setPill("local", "이 브라우저에 저장");
  renderRail(); renderSheet();
}

}

/* ---------- chat ---------- */
function startChat(topic){
  if (S.busy) return;
  S.chat = { topic, messages: [{role:"assistant", content: topic.open}], hints: {}, startedAt: Date.now() };
  S.view = "chat"; S.tab = "topics";
  renderRail(); renderSheet(); closeRail();
  if (V.on) sayThen(topic.open);
  else if (S.autoSpeak) speak(topic.open);
  setTimeout(() => $("#input") && $("#input").focus(), 50);
}
function autosize(ta){ ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 140) + "px"; }
function userTurns(){ return S.chat ? S.chat.messages.filter(m => m.role === "user").length : 0; }

function renderSheet(){
  const sh = $("#sheet");
  document.body.classList.toggle("quiz", S.quiz && S.view === "notes");
  if (V.on && S.view !== "chat") voiceStop();

  if (S.view === "review") return renderReview(sh);

function drawLog(extra){
  const log = $("#log"); if (!log) return;
  const c = S.chat;
  let html = "";
  c.messages.forEach((m, i) => {
    if (m.role === "assistant"){
      html += `<div class="msg"><span class="av">S</span><div class="bubble">${esc(m.content)}</div>${tts ? `<div class="tools"><button class="icon" data-speak="${i}" aria-label="듣기">${ICON.speak}</button></div>` : ""}</div>`;
      const h = c.hints[i];
      if (h) html += `<div class="hint"><b>HINT</b><div>${esc(h.ko)}</div><ul>${(h.ideas||[]).map(x => `<li><span class="en">${esc(x.en)}</span> <span class="ko">${esc(x.ko)}</span></li>`).join("")}</ul></div>`;
    } else {
      html += `<div class="msg me"><span class="av">나</span><div class="bubble">${esc(m.content)}</div></div>`;
    }
  });
  if (extra) html += extra;
  log.innerHTML = html;
  log.scrollTop = log.scrollHeight;
}
$("#sheet").addEventListener("click", e => {
  const b = e.target.closest("[data-speak]");
  if (b && S.chat) speak(S.chat.messages[+b.dataset.speak].content);
});

async function send(){
  const ta = $("#input"); if (!ta || S.busy || !sample) return;
  const text = ta.value.trim(); if (!text) return;
  if (dict && dict.active()) { try { await dict.stop(); } catch(e){} }
  ta.value = ""; ta.dataset.base = ""; autosize(ta);
  const reply = await sendText(text);
  if (reply === null && $("#input")) $("#input").value = text;
  if (reply && S.autoSpeak) speak(reply);
  $("#input") && $("#input").focus();
}
/* sends one learner turn; returns Sam's reply, or null on failure */
async function sendText(text){
  if (!S.chat) return null;
  const chat = S.chat;
  chat.messages.push({role:"user", content:text});
  S.busy = true; renderChat($("#sheet"));
  drawLog(`<div class="msg" id="pending"><span class="av">S</span><div class="bubble typing">…</div></div>`);
  try {
    const res = await sample(chatInput(chat), { cache:false, modelTier:"default", onText: ({text}) => {
      const p = document.querySelector("#pending .bubble"); if (p){ p.classList.remove("typing"); p.textContent = text; $("#log").scrollTop = 1e9; }
    }});
    const reply = (res.text || "").trim() || "Sorry, could you say that again?";
    chat.messages.push({role:"assistant", content: reply});
    S.busy = false; if (S.chat === chat) renderChat($("#sheet"));
    return reply;
  } catch(err){
    chat.messages.pop();
    S.busy = false; if (S.chat === chat){ renderChat($("#sheet")); drawLog(`<div class="err">${esc(errMsg(err))}</div>`); }
    return null;
  }
}

/* ---------- voice call mode ---------- */
const V = { on:false, phase:"idle", base:"", partial:"", timer:null, ignoreUntil:0, micOff:false, safety:null };
const synthOK = "speechSynthesis" in window && typeof SpeechSynthesisUtterance === "function";
try { S.pauseMs = +localStorage.getItem("ets_pause") || 2500; S.rate = +localStorage.getItem("ets_rate") || 0.95; } catch(e){ S.pauseMs = 2500; S.rate = 0.95; }
const PHASE_TEXT = {
  listening: "듣고 있어요. 말을 멈추면 자동으로 보내요",
  thinking: "Sam이 생각하는 중…",
  speaking: "Sam이 말하는 중 (버튼을 누르면 건너뛰기)",
  idle: "",
};
function liveText(){ return (V.base + V.partial).trim(); }
function callHtml(){
  return `<div class="call" id="call">
    <button class="orb" id="orb" aria-label="음성 대화 버튼">${ICON.mic}</button>
    <div class="status" id="callStatus"></div>
    <div class="live" id="liveText" data-ph="영어로 말해 보세요"></div>
    <div class="row">
      <button class="btn" id="vSend">지금 보내기</button>
      <button class="btn" id="vClear">다시 말하기</button>
      <button class="btn" id="vHint" ${S.busy ? "disabled" : ""}>${ICON.hint}<span class="lbl">힌트</span></button>
      <select id="vPause" aria-label="자동 전송까지 기다리는 시간">
        ${[1500,2500,4000].map(ms => `<option value="${ms}" ${S.pauseMs === ms ? "selected" : ""}>멈춤 ${ms/1000}초 후 전송</option>`).join("")}
      </select>
      ${synthOK ? `<select id="vRate" aria-label="Sam 말하기 속도">${[[0.8,"천천히"],[0.95,"보통"],[1.1,"빠르게"]].map(([r,l]) => `<option value="${r}" ${S.rate === r ? "selected" : ""}>Sam 속도 ${l}</option>`).join("")}</select>` : ""}
    </div>
    <div class="note">${synthOK ? "스피커 소리가 마이크에 들어가지 않도록 이어폰을 쓰면 더 정확해요." : "이 브라우저는 Sam의 목소리를 낼 수 없어서 글로만 답해요."}</div>
  </div>`;
}
function bindCall(){
  $("#orb").onclick = () => {
    if (V.micOff){ restartMic(); return; }
    if (V.phase === "speaking"){ try { speechSynthesis.cancel(); } catch(e){} toListening(); return; }
    if (V.phase === "listening") voiceSend();
  };
  $("#vSend").onclick = () => voiceSend();
  $("#vClear").onclick = () => { V.base = ""; V.partial = ""; clearTimeout(V.timer); drawCall(); };
  $("#vHint").onclick = () => hint();
  $("#vPause").onchange = e => { S.pauseMs = +e.target.value; try { localStorage.setItem("ets_pause", S.pauseMs); } catch(_){} };
  const vr = $("#vRate"); if (vr) vr.onchange = e => { S.rate = +e.target.value; try { localStorage.setItem("ets_rate", S.rate); } catch(_){} };
}
function drawCall(){
  const c = $("#call"); if (!c) return;
  c.dataset.phase = V.phase; c.dataset.mic = V.micOff ? "off" : "on";
  $("#callStatus").textContent = V.micOff ? "마이크가 꺼졌어요. 가운데 버튼을 눌러 다시 켜 주세요" : PHASE_TEXT[V.phase] || "";
  $("#liveText").textContent = V.phase === "listening" ? liveText() : "";
  $("#vSend").disabled = V.phase !== "listening" || !liveText();
}
function voiceStart(){
  if (!dict || !S.chat || !sample) return;
  V.on = true; V.micOff = false; V.base = ""; V.partial = "";
  dict.start({ language:"en" }).catch(onMicError);   // must run synchronously inside the click
  if (synthOK){ try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch(e){} }
  V.phase = "idle";
  renderChat($("#sheet"));
  const last = S.chat.messages[S.chat.messages.length - 1];
  if (S.busy) setPhase("thinking");
  else if (last && last.role === "assistant") sayThen(last.content);
  else toListening();
}
function restartMic(){
  if (!dict) return;
  V.micOff = false; drawCall();
  dict.start({ language:"en" }).catch(onMicError);
}
function onMicError(err){
  if (!V.on) return;
  const code = err && err.code;
  if (code === "not_granted" || code === "unavailable"){
    voiceStop(); renderChat($("#sheet"));
    drawLog(`<div class="err">${code === "not_granted" ? "마이크 사용이 허용되지 않았어요. 페이지 권한 메뉴에서 받아쓰기를 허용해 주세요." : "이 화면에서는 음성 입력을 쓸 수 없어요."}</div>`);
  } else { V.micOff = true; drawCall(); }
}
function voiceStop(){
  V.on = false; V.phase = "idle"; clearTimeout(V.timer); clearTimeout(V.safety);
  if (synthOK) try { speechSynthesis.cancel(); } catch(e){}
  if (dict && dict.active()) dict.stop().catch(() => {});
}
function setPhase(p){ V.phase = p; if (p !== "listening") clearTimeout(V.timer); drawCall(); }
function toListening(){
  clearTimeout(V.safety);
  V.base = ""; V.partial = ""; V.ignoreUntil = Date.now() + (synthOK ? 700 : 0);
  setPhase("listening");
}
function heard(){ return V.on && V.phase === "listening" && Date.now() >= V.ignoreUntil; }
function voicePartial(text){ if (!heard()) return; V.partial = text; drawCall(); arm(); }
function voiceFinal(text){ if (!heard()) return; V.base = V.base ? V.base + text : text.trimStart(); V.partial = ""; drawCall(); arm(); }
function arm(){ clearTimeout(V.timer); if (liveText()) V.timer = setTimeout(voiceSend, S.pauseMs); }
async function voiceSend(){
  const t = liveText();
  if (!V.on || V.phase !== "listening" || !t || S.busy) return;
  setPhase("thinking");
  const chat = S.chat;
  const reply = await sendText(t);
  if (!V.on || S.chat !== chat) return;
  if (reply) sayThen(reply); else toListening();
}
function pickVoice(){
  try {
    const vs = speechSynthesis.getVoices().filter(v => /^en[-_]US/i.test(v.lang));
    return vs.find(v => /natural|google us english|samantha|aria|jenny|ava/i.test(v.name)) || vs[0] || null;
  } catch(e){ return null; }
}
function sayThen(text){
  if (!V.on) return;
  if (!synthOK){ toListening(); return; }
  setPhase("speaking");
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = S.rate; const v = pickVoice(); if (v) u.voice = v;
  const done = () => { if (V.on && V.phase === "speaking") setTimeout(() => { if (V.on && V.phase === "speaking") toListening(); }, 400); };
  u.onend = done; u.onerror = done;
  clearTimeout(V.safety);
  V.safety = setTimeout(done, text.split(/\s+/).length * 600 / S.rate + 4000);
  try { speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){ toListening(); }
}
function errMsg(err){
  const code = err && err.code;
  if (code === "not_granted") return "Claude 사용 권한이 꺼져 있어요. 페이지 권한 메뉴에서 허용한 뒤 다시 보내 주세요.";
  if (code === "rate_limited") return "요청이 많아요. 잠시 뒤 다시 보내 주세요.";
  return "답변을 받지 못했어요. 다시 보내 주세요.";
}

async function hint(){
  if (S.busy || !sample) return;
  const c = S.chat;
  let idx = c.messages.length - 1; while (idx >= 0 && c.messages[idx].role !== "assistant") idx--;
  if (idx < 0 || c.hints[idx]) return;
  S.busy = true; renderChat($("#sheet"));
  drawLog(`<div class="hint typing">힌트를 만드는 중…</div>`);
  try {
    const h = await sample.json(`An English learner (Korean, intermediate) is in a conversation about "${c.topic.en}". The partner just said:
"${c.messages[idx].content}"
Return JSON only: {"ko": "<natural Korean translation of what the partner said>", "ideas": [{"en": "<a short natural English answer starter the learner could say>", "ko": "<Korean meaning>"}]} with exactly 3 ideas of different directions, each under 15 words.`, { modelTier:"quick" });
    c.hints[idx] = { ko: String(h.ko || ""), ideas: Array.isArray(h.ideas) ? h.ideas.slice(0,3) : [] };
    S.busy = false; renderChat($("#sheet"));
  } catch(err){
    S.busy = false; renderChat($("#sheet")); drawLog(`<div class="err">${esc(errMsg(err))}</div>`);
  }
}

async function speak(text){
  if (!tts) return;
  try { await tts.speak(text, { language:"en" }); } catch(e){}
}
function toggleMic(){
  if (!dict) return;
  if (dict.active()){ dict.stop().catch(() => {}); return; }
  const ta = $("#input"); ta.dataset.base = ta.value ? ta.value.trim() + " " : "";
  dict.start({ language:"en" }).catch(err => {
    if (err && err.code === "not_granted"){ const b = $("#micBtn"); if (b) b.remove(); dict = null; }
  });
}

/* ---------- finish & review ---------- */
async function finish(){
  if (S.busy || !sample || userTurns() < 1) return;
  if (V.on) voiceStop();
  if (dict && dict.active()) { try { await dict.stop(); } catch(e){} }
  S.busy = true; renderChat($("#sheet"));
  drawLog(`<div class="hint typing">대화를 분석해서 교정 노트를 만드는 중이에요…</div>`);
  const c = S.chat;
  try {
    const r = await sample.json(`You are an expert English speaking coach for Korean adult learners. Review the LEARNER lines in this conversation transcript.

Topic: ${c.topic.en}
Transcript:
${transcriptText(c)}

Return JSON only, with Korean explanations:
{
 "level": "<one of: Beginner, Intermediate Low, Intermediate Mid, Intermediate High, Advanced>",
 "summary": "<2-3 sentence overall feedback in Korean>",
 "strengths": ["<what the learner did well, Korean, quote their English when useful>"],
 "corrections": [
   {"said": "<exact sentence or phrase the LEARNER wrote>", "better": "<corrected natural version>", "category": "<one of: grammar, tense, article, preposition, vocabulary, naturalness, word_order>", "why": "<short Korean explanation of the rule or nuance>"}
 ],
 "expressions": [{"en": "<useful natural expression for this topic>", "ko": "<Korean meaning>"}],
 "next_tip": "<one concrete thing to practice next time, Korean>"
}
Rules: "said" must be copied from the LEARNER lines exactly; never invent sentences. Include every real mistake and also sentences that are correct but sound unnatural (category naturalness). Skip pure typos only if obvious. 3-6 expressions. If the learner made no mistakes, return an empty corrections array.`, { modelTier:"complex", cache:false });
    const sess = {
      id: "s" + Date.now().toString(36),
      topicId: c.topic.id, topicKo: c.topic.ko, topicEn: c.topic.en,
      startedAt: c.startedAt, endedAt: Date.now(), turns: userTurns(),
      messages: c.messages.map(m => ({role:m.role, content:m.content})),
      review: {
        level: String(r.level || ""), summary: String(r.summary || ""),
        strengths: Array.isArray(r.strengths) ? r.strengths.map(String) : [],
        corrections: (Array.isArray(r.corrections) ? r.corrections : []).map(x => ({said:String(x.said||""), better:String(x.better||""), category:String(x.category||"naturalness"), why:String(x.why||"")})),
        expressions: (Array.isArray(r.expressions) ? r.expressions : []).map(x => ({en:String(x.en||""), ko:String(x.ko||"")})),
        next_tip: String(r.next_tip || ""),
      },
    };
    S.sessions = [sess, ...S.sessions.filter(x => x.id !== sess.id)];
    await saveSession(sess);
    S.chat = null; S.busy = false;
    S.view = "review"; S.openId = sess.id; S.tab = "past";
    renderRail(); renderSheet();
  } catch(err){
    S.busy = false; renderChat($("#sheet"));
    drawLog(`<div class="err">${esc(err && err.code === "invalid_json" ? "분석 결과를 읽지 못했어요. 대화 마무리를 다시 눌러 주세요." : errMsg(err))}</div>`);
  }
}

function fixHtml(f, withMeta){
  return `<div class="fix">
    <div><span class="said">${esc(f.said)}</span><span class="tag">${esc(CATS[f.category] || f.category)}</span></div>
    <div class="better-wrap"><span class="arrow">→</span><span class="better">${esc(f.better)}</span></div>
    <div class="why">${esc(f.why)}</div>
    ${withMeta ? `<div class="date">${fmtDate(f.at)} · ${esc(f.topic)}</div>` : ""}
  </div>`;
}

function renderReview(sh){
  const s = S.sessions.find(x => x.id === S.openId);
  if (!s){ S.view = "welcome"; return renderSheet(); }
  const r = s.review || {};
  sh.innerHTML = `
    <div class="sheet-head">
      <div class="t"><div class="eyebrow">지난 주제 · ${fmtDate(s.endedAt)} · ${s.turns || 0}턴</div><h1>${esc(s.topicKo)} — ${esc(s.topicEn)}</h1></div>
      <div class="head-actions">
        <button class="btn primary" id="againBtn">이 주제로 다시 대화</button>
        <button class="btn warn" id="delBtn">삭제</button>
      </div>
    </div>
    <div class="doc">
      <section class="card">
        <h2>총평</h2>
        ${r.level ? `<span class="level">${esc(r.level)}</span>` : ""}
        <p class="summary">${esc(r.summary)}</p>
      </section>
      ${(r.strengths||[]).length ? `<section class="card"><h2>잘한 점</h2><ul class="list">${r.strengths.map(x => `<li>${esc(x)}</li>`).join("")}</ul></section>` : ""}
      <section class="card"><h2>고쳐 말하기 · ${(r.corrections||[]).length}문장</h2>
        ${(r.corrections||[]).length ? r.corrections.map(f => fixHtml(f)).join("") : `<p class="why">이번 대화에서는 고칠 문장이 없었어요.</p>`}
      </section>
      ${(r.expressions||[]).length ? `<section class="card"><h2>오늘의 표현</h2><div class="expr">${r.expressions.map(x => `<div class="en">${esc(x.en)}</div><div class="ko">${esc(x.ko)}</div>`).join("")}</div></section>` : ""}
      ${r.next_tip ? `<section class="card"><h2>다음 연습 포인트</h2><p class="summary">${esc(r.next_tip)}</p></section>` : ""}
      <section class="card transcript"><h2>대화 전문</h2>
        ${(s.messages||[]).map(m => `<div class="line"><span class="who">${m.role === "user" ? "나" : "Sam"}</span><span class="${m.role === "user" ? "me" : "ai"}">${esc(m.content)}</span></div>`).join("")}
      </section>
    </div>`;
  $("#againBtn").onclick = () => startChat(TOPICS.find(t => t.id === s.topicId) || {id:"custom", ko:s.topicKo, en:s.topicEn, open:`Let's talk about "${s.topicEn}" again! What would you like to share this time?`});
  const del = $("#delBtn");
  del.onclick = async () => {
    if (!del.classList.contains("armed")){ del.classList.add("armed"); del.textContent = "정말 삭제"; setTimeout(() => { if (del.isConnected){ del.classList.remove("armed"); del.textContent = "삭제"; } }, 3000); return; }
    del.disabled = true;
    try { await deleteSession(s.id); S.view = "welcome"; S.openId = null; renderRail(); renderSheet(); }
    catch(e){ del.disabled = false; del.textContent = "삭제 실패"; }
  };
}

function renderNotes(sh){
  const all = allFixes();
  const list = S.noteCat ? all.filter(f => f.category === S.noteCat) : all;
  const counts = {}; all.forEach(f => counts[f.category] = (counts[f.category] || 0) + 1);
  const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  const max = sorted.length ? sorted[0][1] : 1;
  sh.innerHTML = `
    <div class="sheet-head">
      <div class="t"><div class="eyebrow">오답노트 · ${S.sessions.length}개 대화</div><h1>${S.noteCat ? esc(CATS[S.noteCat] || S.noteCat) : "자주 틀리는 문장 모음"}</h1></div>
      <div class="head-actions">
        <button class="btn ${S.quiz ? "primary" : ""}" id="quizBtn" ${list.length ? "" : "disabled"}>${S.quiz ? "정답 모두 보기" : "가리고 복습"}</button>
        <button class="btn" id="anaBtn" ${all.length && sample && !S.busy ? "" : "disabled"}>약점 분석</button>
      </div>
    </div>
    <div class="doc">
      ${!all.length ? `<div class="center"><div><h2>아직 오답노트가 비어 있어요</h2><p>대화를 마무리하면 고칠 문장이 여기에 유형별로 모여요.</p></div></div>` : `
      <section class="card"><h2>유형별 실수</h2><div class="bars">
        ${sorted.map(([k,n]) => `<div class="bar-row"><span>${esc(CATS[k] || k)}</span><div class="bar"><b style="width:${(n/max*100).toFixed(0)}%"></b></div><span class="n">${n}</span></div>`).join("")}
      </div></section>
      ${S.analysis || S.busy ? `<section class="card"><h2>약점 분석</h2><div class="analysis">${S.busy ? "분석하는 중…" : esc(S.analysis)}</div></section>` : ""}
      <section class="card"><h2>${S.quiz ? "흐린 부분을 누르면 정답이 보여요" : "교정 문장"} · ${list.length}</h2>
        ${list.map(f => fixHtml(f, true)).join("")}
      </section>`}
    </div>`;
  const q = $("#quizBtn"); if (q) q.onclick = () => { S.quiz = !S.quiz; renderSheet(); };
  const a = $("#anaBtn"); if (a) a.onclick = analyze;
}
$("#sheet").addEventListener("click", e => {
  const w = e.target.closest("body.quiz .better-wrap");
  if (w){ w.classList.add("reveal"); w.closest(".fix").classList.add("revealed"); }
});
async function analyze(){
  if (S.busy || !sample) return;
  S.busy = true; renderSheet();
  const fixes = allFixes().slice(0, 120).map(f => `- [${f.category}] "${f.said}" -> "${f.better}"`).join("\n");
  try {
    const r = await sample(`다음은 한국인 영어 학습자가 회화 중에 틀린 문장과 교정 목록이다.\n${fixes}\n\n반복되는 실수 패턴을 3~5개로 묶어 한국어로 정리해라. 각 패턴마다 "• 패턴 이름: 설명 (예: 틀린 문장 → 고친 문장)" 형식으로 한 줄씩 쓰고, 마지막 줄에 "→ 다음 대화 연습법:"으로 구체적인 연습 방법 하나를 적어라. 마크다운 굵게 표시는 쓰지 마라.`, { modelTier:"default", cache:false });
    S.analysis = r.text.trim();
  } catch(err){ S.analysis = errMsg(err); }
  S.busy = false; renderSheet();
}

/* ---------- start ---------- */
renderRail(); renderSheet();
setTimeout(() => boot(), 0);
})();
</script>
